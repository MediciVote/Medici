<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connection Test</title>
<style>
  body { margin: 0; background: #0f1115; color: #e7e9ee; font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  main { max-width: 420px; padding: 24px 16px; text-align: center; }
  button { background: #e0b354; color: #17130a; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  p { color: #8b93a5; }
</style>
</head>
<body>
<main>
  <h1>Connection test</h1>
  <p>This page only asks your wallet for its address. It loads no libraries and requests no approvals or signatures.</p>
  <button id="go">Connect</button>
  <p id="out"></p>
</main>
<script>
document.getElementById("go").onclick = async () => {
  const out = document.getElementById("out");
  if (!window.ethereum) { out.textContent = "No wallet found."; return; }
  try {
    const [a] = await window.ethereum.request({ method: "eth_requestAccounts" });
    out.textContent = "Connected: " + a;
  } catch (e) { out.textContent = "Not connected: " + (e.message || e); }
};
</script>
</body>
</html>
